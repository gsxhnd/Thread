[package]
name = "thread-core"
version = "0.1.0-alpha.1"
description = "Domain layer for Thread: workspace files, protocol clients, capture proxy and local storage."
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "time", "net"] }
dirs = "6.0.0"
toml = "0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["clock"] }
futures-util = "0.3.33"
parking_lot = "0.12.5"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tonic = { version = "0.14.6", features = ["tls-native-roots", "tls-aws-lc"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
bytes = "1.12.1"
http = "1.5.0"
base64 = "0.23.1"
url = "2.5.8"
hyper = { version = "1.12.0", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "tls12", "aws-lc-rs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
tokio-rustls = "0.26.4"
sha2 = "0.10.9"
http-body = "1"
pem = "4"

[dev-dependencies]
tokio-stream = "0.1.19"
tower = "0.5.3"
