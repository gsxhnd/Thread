[package]
name = "thread"
version = "0.1.0-alpha.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "time", "net"] }
dirs = "6.0.0"
toml = "0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["clock"] }
futures-util = "0.3.33"
parking_lot = "0.12.5"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tonic = { version = "0.14.6", features = ["tls-native-roots", "tls-aws-lc"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
bytes = "1.12.1"
http = "1.5.0"
base64 = "0.23.1"
url = "2.5.8"
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "tls12", "aws-lc-rs"] }

[dev-dependencies]
tokio-stream = "0.1.19"
tower = "0.5.3"
