name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.rust_target }} -p thread-app

      - name: Package macOS app bundle and DMG
        if: startsWith(matrix.rust_target, 'aarch64-apple') || startsWith(matrix.rust_target, 'x86_64-apple')
        shell: bash
        run: |
          set -euo pipefail
          release_dir="target/${{ matrix.rust_target }}/release"
          app="$release_dir/Thread.app"
          mkdir -p "$app/Contents/MacOS"
          cp "$release_dir/thread" "$app/Contents/MacOS/thread"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          short_version="${version%%-*}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Thread</string>
            <key>CFBundleDisplayName</key><string>Thread</string>
            <key>CFBundleIdentifier</key><string>dev.thread.gpui</string>
            <key>CFBundleExecutable</key><string>thread</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$short_version</string>
            <key>CFBundleVersion</key><string>$GITHUB_RUN_NUMBER</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          dmg="$release_dir/thread-${{ matrix.rust_target }}.dmg"
          hdiutil create -volname Thread -srcfolder "$app" -ov -format UDZO "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Package (unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.rust_target }}/release
          archive="thread-${{ matrix.rust_target }}.tar.gz"
          tar -czf "$archive" thread
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Package (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location target/${{ matrix.rust_target }}/release
          $archive = "thread-${{ matrix.rust_target }}.zip"
          7z a $archive thread.exe
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thread-${{ matrix.rust_target }}
          path: target/${{ matrix.rust_target }}/release/thread-${{ matrix.rust_target }}*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify tag matches workspace version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match workspace version {expected!r}")
          PY

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(
            thread-aarch64-apple-darwin.dmg
            thread-aarch64-apple-darwin.dmg.sha256
            thread-aarch64-apple-darwin.tar.gz
            thread-aarch64-apple-darwin.tar.gz.sha256
            thread-x86_64-apple-darwin.dmg
            thread-x86_64-apple-darwin.dmg.sha256
            thread-x86_64-apple-darwin.tar.gz
            thread-x86_64-apple-darwin.tar.gz.sha256
            thread-x86_64-unknown-linux-gnu.tar.gz
            thread-x86_64-unknown-linux-gnu.tar.gz.sha256
            thread-x86_64-pc-windows-msvc.zip
            thread-x86_64-pc-windows-msvc.zip.sha256
          )
          for artifact in "${artifacts[@]}"; do
            if [[ ! -f "dist/$artifact" ]]; then
              echo "Missing release artifact: $artifact" >&2
              exit 1
            fi
          done
          checksums=(dist/*.sha256)
          if (( ${#checksums[@]} == 0 )); then
            echo "No SHA-256 checksum files were downloaded" >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            (cd dist && sha256sum --check "$(basename "$checksum")")
          done

      - name: Create one draft release with all artifacts
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Thread ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
