name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxkbcommon-dev \
            libssl-dev \
            libfontconfig1-dev \
            libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.rust_target }} -p thread-app

      - name: Package (unix)
        if: matrix.platform != 'windows-latest'
        run: |
          cd target/${{ matrix.rust_target }}/release
          tar -czf thread-${{ matrix.rust_target }}.tar.gz thread
          shasum -a 256 thread-${{ matrix.rust_target }}.tar.gz > thread-${{ matrix.rust_target }}.tar.gz.sha256

      - name: Package (windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cd target/${{ matrix.rust_target }}/release
          7z a thread-${{ matrix.rust_target }}.zip thread.exe
          Get-FileHash thread-${{ matrix.rust_target }}.zip -Algorithm SHA256 | Out-File -Encoding ascii thread-${{ matrix.rust_target }}.zip.sha256
        shell: pwsh

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Thread ${{ github.ref_name }}
          draft: true
          files: |
            target/${{ matrix.rust_target }}/release/thread-${{ matrix.rust_target }}.tar.gz
            target/${{ matrix.rust_target }}/release/thread-${{ matrix.rust_target }}.tar.gz.sha256
            target/${{ matrix.rust_target }}/release/thread-${{ matrix.rust_target }}.zip
            target/${{ matrix.rust_target }}/release/thread-${{ matrix.rust_target }}.zip.sha256
